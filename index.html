<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qori — Prototipo de scroll</title>
<style>
  :root {
    --ivory: #F2EDE4;
    --gold: #B79556;
    --smoked: #2E2620;
    --amber: #C97F2A;
    --espresso: #241C16;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: var(--ivory);
    color: var(--espresso);
    font-family: 'Georgia', 'Cormorant Garamond', serif;
    /* NO usar overflow-x aqui: rompe position:sticky */
  }


  section {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px;
  }

  .filler {
    flex-direction: column;
    gap: 12px;
  }

  .filler h2 {
    font-size: clamp(28px, 5vw, 48px);
    font-weight: 400;
    letter-spacing: 0.5px;
  }

  .filler p {
    font-family: -apple-system, sans-serif;
    font-size: 14px;
    color: var(--smoked);
    opacity: 0.6;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  #hero-pin {
    height: 400vh; /* scroll distance that drives the full rotation */
    position: relative;
  }

  .hero-sticky {
    position: sticky;
    top: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .hero-label {
    font-family: -apple-system, sans-serif;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    opacity: 0.5;
    margin-bottom: 14px;
  }

  canvas#rotator {
    height: 58vh;
    width: auto;
    max-width: 44vw;
  }

  @media (max-width: 700px) {
    canvas#rotator {
      height: 62vh;
      max-width: 86vw;
    }
    .hero-word { font-size: 44px; }
  }

  .hero-word {
    margin-top: 26px;
    font-size: clamp(36px, 7vw, 64px);
    letter-spacing: 4px;
    color: var(--espresso);
  }

  .hero-tag {
    margin-top: 8px;
    font-family: -apple-system, sans-serif;
    font-size: 13px;
    letter-spacing: 2px;
    opacity: 0.55;
    text-transform: uppercase;
  }

  #loader {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: -apple-system, sans-serif;
    font-size: 13px;
    letter-spacing: 2px;
    color: var(--smoked);
    opacity: 0.5;
    transition: opacity 0.6s ease;
    pointer-events: none;
  }

  .progress-track {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    width: 160px;
    height: 2px;
    background: rgba(36,28,22,0.15);
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: var(--gold);
  }
</style>
</head>
<body>



<section class="filler">
  <p>Scroll para empezar</p>
  <h2>Qori</h2>
</section>

<div id="hero-pin">
  <div class="hero-sticky">
    <div class="hero-label">Single-Origin · Perú</div>
    <div id="loader">0%</div>
    <canvas id="rotator" width="1080" height="1920"></canvas>
    <div class="hero-word">Qori</div>
    <div class="hero-tag">Luminosidad natural</div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </div>
</div>

<section class="filler">
  <p>Sección siguiente (origen, producto, etc.)</p>
  <h2>Continúa el scroll normal aquí</h2>
</section>

<section class="filler">
  <p>Fin del prototipo</p>
  <h2>—</h2>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);

// ---------------------------------------------------------------
// 1) CARGAR LOS FRAMES REALES
// Los archivos deben estar en una carpeta llamada "frames/"
// junto a este index.html
// ---------------------------------------------------------------
const TOTAL_FRAMES = 120;
const frames = [];
let loadedCount = 0;

const loaderEl = document.getElementById('loader');

for (let i = 0; i < TOTAL_FRAMES; i++) {
  const img = new Image();
  img.src = `frames/bottle_${String(i).padStart(5, '0')}.webp`;

  img.onload = () => {
    loadedCount++;
    if (loadedCount === 1) renderFrame(0);
    if (loaderEl) {
      const pct = Math.round((loadedCount / TOTAL_FRAMES) * 100);
      loaderEl.textContent = pct + '%';
      if (loadedCount === TOTAL_FRAMES) {
        loaderEl.style.opacity = '0';
      }
    }
  };

  img.onerror = () => {
    if (loaderEl) {
      loaderEl.textContent = 'No se encontro frames/bottle_' + String(i).padStart(5,'0') + '.webp';
      loaderEl.style.fontSize = '11px';
    }
  };

  frames.push(img);
}

// ---------------------------------------------------------------
// 2) CANVAS DE DESTINO + DIBUJO DEL FRAME SEGÚN SCROLL
// Esta parte SÍ es la lógica real que se usará en producción.
// ---------------------------------------------------------------
const canvas = document.getElementById('rotator');
const ctx = canvas.getContext('2d');
const progressFill = document.getElementById('progressFill');

function renderFrame(index) {
  const clamped = Math.max(0, Math.min(TOTAL_FRAMES - 1, index));
  const img = frames[clamped];
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (img.complete) ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
}

renderFrame(0);

// ---------------------------------------------------------------
// 3) SCROLLTRIGGER — pin + scrub
// ---------------------------------------------------------------
ScrollTrigger.create({
  trigger: '#hero-pin',
  start: 'top top',
  end: 'bottom bottom',
  scrub: 0.4,
  onUpdate: (self) => {
    const frameIndex = Math.round(self.progress * (TOTAL_FRAMES - 1));
    renderFrame(frameIndex);
    progressFill.style.width = (self.progress * 100) + '%';
  }
});
</script>
</body>
</html>
