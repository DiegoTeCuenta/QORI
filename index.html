<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qori — Luminosidad natural</title>
<style>
  :root {
    --ivory: #F2EDE4;
    --gold: #B79556;
    --smoked: #2E2620;
    --amber: #C97F2A;
    --espresso: #241C16;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: var(--ivory);
    color: var(--espresso);
    font-family: 'Georgia', 'Cormorant Garamond', serif;
  }

  section.filler {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px;
    gap: 12px;
  }

  section.filler h2 { font-size: clamp(28px, 5vw, 48px); font-weight: 400; }
  section.filler p {
    font-family: -apple-system, sans-serif;
    font-size: 14px; opacity: 0.6;
    letter-spacing: 1px; text-transform: uppercase;
  }

  /* ================= HERO ================= */
  #hero-pin { height: 400vh; position: relative; }
  .hero-sticky {
    position: sticky; top: 0; height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .hero-label {
    font-family: -apple-system, sans-serif; font-size: 12px;
    letter-spacing: 3px; text-transform: uppercase;
    opacity: 0.5; margin-bottom: 14px;
  }
  canvas#rotator { height: 58vh; width: auto; max-width: 44vw; }
  .hero-word { margin-top: 26px; font-size: clamp(36px, 7vw, 64px); letter-spacing: 4px; }
  .hero-tag {
    margin-top: 8px; font-family: -apple-system, sans-serif;
    font-size: 13px; letter-spacing: 2px; opacity: 0.55; text-transform: uppercase;
  }
  .progress-track {
    position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
    width: 160px; height: 2px; background: rgba(36,28,22,0.15);
  }
  .progress-fill { height: 100%; width: 0%; background: var(--gold); }

  /* ================= ORIGEN ================= */
  #origen-pin { height: 420vh; position: relative; }
  .origen-sticky {
    position: sticky; top: 0; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    gap: 6vw; padding: 0 6vw;
  }
  canvas#pod { height: 78vh; width: auto; max-width: 40vw; flex-shrink: 0; }
  .origen-copy { max-width: 380px; }

  .reveal {
    opacity: 0; transform: translateY(22px);
    transition: opacity 0.9s ease, transform 0.9s ease;
  }
  .reveal.is-visible { opacity: 1; transform: translateY(0); }

  .origen-copy h2 {
    font-size: clamp(30px, 3.4vw, 46px); font-weight: 400;
    line-height: 1.15; margin-bottom: 26px;
  }
  .origen-copy p {
    font-family: -apple-system, sans-serif; font-size: 15px;
    line-height: 1.8; color: var(--smoked); opacity: 0.78; margin-bottom: 22px;
  }
  .origen-copy .origin-tag {
    font-family: -apple-system, sans-serif; font-size: 11px;
    letter-spacing: 3px; text-transform: uppercase; opacity: 0.45; margin: 0;
  }
  .rule { width: 46px; height: 1px; background: var(--gold); margin-bottom: 26px; }

  @media (max-width: 820px) {
    canvas#rotator { height: 62vh; max-width: 86vw; }
    .hero-word { font-size: 44px; }
    .origen-sticky { flex-direction: column; gap: 0; padding: 5vh 8vw; }
    canvas#pod { height: 46vh; max-width: 80vw; }
    .origen-copy { max-width: 100%; text-align: center; }
    .origen-copy h2 { font-size: 27px; margin-bottom: 16px; }
    .origen-copy p { font-size: 14px; margin-bottom: 14px; }
    .rule { margin: 0 auto 16px; }
  }
</style>
</head>
<body>

<section class="filler">
  <p>Scroll para empezar</p>
  <h2>Qori</h2>
</section>

<div id="hero-pin">
  <div class="hero-sticky">
    <div class="hero-label">Single-Origin · Perú</div>
    <canvas id="rotator" width="1080" height="1920"></canvas>
    <div class="hero-word">Qori</div>
    <div class="hero-tag">Luminosidad natural</div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </div>
</div>

<div id="origen-pin">
  <div class="origen-sticky">
    <canvas id="pod" width="1080" height="1920"></canvas>
    <div class="origen-copy">
      <div class="rule reveal" data-at="0.12"></div>
      <h2 class="reveal" data-at="0.16">Del corazón<br>de la Amazonía.</h2>
      <p class="reveal" data-at="0.42">Una semilla que crece envuelta en su propia estrella.</p>
      <p class="reveal" data-at="0.62">Prensada en frío, sin nada más.</p>
      <p class="origin-tag reveal" data-at="0.80">Single-Origin · Perú</p>
    </div>
  </div>
</div>

<section class="filler">
  <p>Siguiente sección</p>
  <h2>Producto</h2>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);

function buildSequence({ canvasId, triggerId, total, srcFor, onUpdateExtra }) {
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext('2d');
  const frames = [];
  let loadedCount = 0;

  function isReady(img) { return img && img.complete && img.naturalWidth > 0; }

  // dibuja el frame pedido; si no cargó, busca el más cercano que sí
  function render(index) {
    let i = Math.max(0, Math.min(total - 1, index));
    let img = frames[i];

    if (!isReady(img)) {
      let found = null;
      for (let d = 1; d < total; d++) {
        if (isReady(frames[i - d])) { found = frames[i - d]; break; }
        if (isReady(frames[i + d])) { found = frames[i + d]; break; }
      }
      img = found;
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (img) ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  }

  for (let i = 0; i < total; i++) {
    const img = new Image();
    const src = srcFor(i);
    img.onload = () => {
      loadedCount++;
      if (loadedCount === 1) render(0);
    };
    img.src = src;
    frames.push(img);
  }

  ScrollTrigger.create({
    trigger: triggerId,
    start: 'top top',
    end: 'bottom bottom',
    scrub: 0.4,
    onUpdate: (self) => {
      render(Math.round(self.progress * (total - 1)));
      if (onUpdateExtra) onUpdateExtra(self.progress);
    }
  });
}

/* HERO */
buildSequence({
  canvasId: 'rotator',
  triggerId: '#hero-pin',
  total: 120,
  srcFor: (i) => `frames/bottle_${String(i).padStart(5, '0')}.webp`,
  onUpdateExtra: (p) => {
    document.getElementById('progressFill').style.width = (p * 100) + '%';
  }
});

/* ORIGEN */
const revealEls = Array.from(document.querySelectorAll('.origen-copy .reveal'));
function revealCopy(progress) {
  revealEls.forEach(el => {
    el.classList.toggle('is-visible', progress >= parseFloat(el.dataset.at));
  });
}

buildSequence({
  canvasId: 'pod',
  triggerId: '#origen-pin',
  total: 121,
  srcFor: (i) => `frames/a00${i + 1}.webp`,
  onUpdateExtra: revealCopy
});

</script>
</body>
</html>
